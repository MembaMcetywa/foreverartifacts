services:
  postgres:
    image: postgres:17-alpine
    container_name: foreverartifacts-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foreverartifacts
    ports:
      - '5432:5432'
    volumes:
      - foreverartifacts-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d foreverartifacts']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foreverartifacts-postgres-data:
