name: FA Backend Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - prisma/**
      - src/**
      - nest-cli.json
      - prisma.config.ts
      - tsconfig*.json
      - .github/workflows/backend-image.yml
      - certs/**

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate deployment variables
        run: |
          test -n "$ECR_REPOSITORY"
          test -n "$ECS_CLUSTER"
          test -n "$ECS_SERVICE"
          test -n "$ECS_CONTAINER_NAME"
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}

      - name: Build image
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Verify image runtime contract
        run: |
          docker run --rm "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" sh -c "test -s /app/certs/rds-global-bundle.pem"
          docker run --rm "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" npm run db:validate
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Push image
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Print image URI
        run: |
          echo "Image URI: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Latest URI: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Download current ECS task definition
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json \
            > ecs-service.json


          SERVICE_FAILURE_COUNT="$(python -c 'import json; data=json.load(open("ecs-service.json")); print(len(data.get("failures", [])))')"
          SERVICE_COUNT="$(python -c 'import json; data=json.load(open("ecs-service.json")); print(len(data.get("services", [])))')"

          if [ "$SERVICE_FAILURE_COUNT" != "0" ]; then
            echo "ECS describe-services returned failures for cluster '$ECS_CLUSTER' and service '$ECS_SERVICE'."
            exit 1
          fi

          if [ "$SERVICE_COUNT" != "1" ]; then
            echo "Expected exactly one ECS service for cluster '$ECS_CLUSTER' and service '$ECS_SERVICE'. Got '$SERVICE_COUNT'."
            exit 1
          fi

          TASK_DEFINITION_ARN="$(python -c 'import json; data=json.load(open("ecs-service.json")); service=data["services"][0]; primary=next((deployment for deployment in service.get("deployments", []) if deployment.get("status") == "PRIMARY"), {}); print(service.get("taskDefinition") or primary.get("taskDefinition") or "")')"

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "No task definition was returned for ECS cluster '$ECS_CLUSTER' and ECS service '$ECS_SERVICE'."
            exit 1
          fi

          echo "Resolved ECS task definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            > task-definition.json

          echo "Task definition container names:"
          python -c 'import json; data=json.load(open("task-definition.json")); print("\n".join(container["name"] for container in data.get("containerDefinitions", [])))'

          CONTAINER_EXISTS="$(python -c 'import json, os; data=json.load(open("task-definition.json")); expected=os.environ["ECS_CONTAINER_NAME"]; print(any(container.get("name") == expected for container in data.get("containerDefinitions", [])))')"

          if [ "$CONTAINER_EXISTS" != "True" ]; then
            echo "Container '$ECS_CONTAINER_NAME' was not found in task definition '$TASK_DEFINITION_ARN'."
            exit 1
          fi
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}

      - name: Render ECS task definition image
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Print deployed ECS service state
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{serviceName:serviceName,status:status,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}' \
            --output json
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
